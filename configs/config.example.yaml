# ──────────────────────────────────────────────
# ── Asterisk Manager Interface (AMI)
# ──────────────────────────────────────────────
asterisk:
  host: "localhost"
  port: 5038
  user: "state"
  pass: "${AMI_PASSWORD}"

#───────────────────────────────────────────────
# ── Redis
# ──────────────────────────────────────────────
redis:
  host: "localhost"
  port: 6379
  pass: "${REDIS_PASSWORD}"

#───────────────────────────────────────────────
# ── Sync
# ──────────────────────────────────────────────
sync:
  interval: "1h"      # 주기적 전체 동기화 및 삭제 단말 정리 간격 (기본값: 1h, 예: 30m, 1h)

#───────────────────────────────────────────────
# ── Logs
# ──────────────────────────────────────────────
log:
  level: "info"       # debug | info | warn | error
  console: false      # 콘솔(Stdout) 출력 여부 (true | false, 기본값: true)
  # path: "./log"     # 경로만 지정 시 state_sync.log 로 저장, 파일명까지 지정 시(예: ./log/app.log) 지정 파일명으로 저장
                      # 미지정 또는 권한 부족 시 Working directory 하위 log 에 저장
  rotation: "daily"   # daily | size
  max_size: 100       # [size 전용] 롤링 기준 파일 크기 (MB)
  max_backups: 10     # [size 전용] 보관할 롤링 파일 최대 개수
  max_age: 30         # 보관 기간 (일) — daily: 오래된 파일 삭제, size: MaxAge
  compress: true      # 롤링된 파일 gzip 압축 여부

#───────────────────────────────────────────────
# ── PID 파일 설정
# ──
# ── 미지정 또는 권한 없을 시 기본값: ./run/state_sync.pid
# ──────────────────────────────────────────────
# pid_file: "./run/state_sync.pid"
